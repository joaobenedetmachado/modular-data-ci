# Same checks without the action: plain pip and the CLI.
name: Data quality (pip)

on: [pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modular-data-ci[sqlalchemy]==0.1.0" psycopg[binary]
      - run: modular-data-ci run --config modular-data-ci.yml --report report.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
