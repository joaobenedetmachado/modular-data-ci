# Checks against a throwaway Postgres seeded by your own script, e.g. to test
# transformations in a pull request before they reach production.
name: Data quality (Postgres service)

on: [pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modular-data-ci[sqlalchemy]" "psycopg[binary]"
      - run: python scripts/seed_database.py   # your transformation / seed step
      - run: modular-data-ci run --report report.json
